<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Starforce Mission Control</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #000; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            overflow: hidden;
            font-family: sans-serif;
        }
        #canvas { 
            max-width: 100vw; 
            max-height: 70vh; 
            box-shadow: 0 0 20px rgba(255,255,255,0.1);
        }
        .instructions {
            color: #888;
            font-size: 14px;
            margin-top: 15px;
            text-align: center;
        }
    </style>
    <!-- Loads a clean, modern web emulator script -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <canvas id="canvas"></canvas>
    <div class="instructions">Starforce Mission Control</div>

    <script>
        // Directly boots your exact ROM file into the canvas element
        Nostalgist.gb({
            rom: 'starforce_game.gb',
            element: document.getElementById('canvas')
        }).then(game => {
            console.log('Game booted successfully!');
        }).catch(err => {
            alert('Error loading game: ' + err.message);
        });
    </script>
</body>
</html>

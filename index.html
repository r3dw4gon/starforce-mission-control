
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Starforce Mission Control</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #000; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            overflow: hidden;
            font-family: monospace;
        }
        #screen-wrapper {
            position: relative;
            width: 320px;
            height: 288px;
            background: #111;
            border: 6px solid #333;
            border-radius: 8px;
        }
        canvas { 
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }
        .status {
            color: #4af626;
            margin-top: 15px;
            font-size: 14px;
            text-shadow: 0 0 5px #4af626;
        }
    </style>
    <!-- Loads a specialized, self-contained mobile web emulator engine -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div id="screen-wrapper">
        <canvas id="game-screen"></canvas>
    </div>
    <div id="status-text" class="status">LAUNCHING STARFORCE SYSTEM...</div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const canvas = document.getElementById('game-screen');
            const status = document.getElementById('status-text');
            
            // Initialize the dedicated mobile Game Boy player layer
            const player = new GBLivePlayer(canvas);
            
            status.innerText = "FETCHING ROM FILE...";
            
            // Explicitly fetch your file path directly from your GitHub repo root
            fetch('starforce_game.gb')
                .then(response => {
                    if (!response.ok) throw new Error("File not found (404). Check spelling!");
                    return response.arrayBuffer();
                })
                .then(buffer => {
                    status.innerText = "BOOTING ROM ENGINE...";
                    player.loadROM(new Uint8Array(buffer));
                    player.play();
                    status.innerText = "SYSTEM ACTIVE: STARFORCE RUNNING";
                })
                .catch(err => {
                    status.style.color = "#ff3333";
                    status.style.textShadow = "0 0 5px #ff3333";
                    status.innerText = "ERROR: " + err.message.toUpperCase();
                });
        });
    </script>
</body>
</html>
